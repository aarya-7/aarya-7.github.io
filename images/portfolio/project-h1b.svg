<svg width="1050" height="700" viewBox="0 0 1050 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1050" height="700" fill="#101112"/>
  <text x="70" y="90" font-family="Manrope, sans-serif" font-size="28" fill="#5b5b5c" letter-spacing="2">ELT PIPELINE</text>

  <!-- pipeline stages -->
  <rect x="70" y="280" width="190" height="140" rx="6" fill="none" stroke="#5b5b5c" stroke-width="3"/>
  <text x="165" y="345" font-family="Inter, sans-serif" font-size="22" fill="#8a8a8b" text-anchor="middle">RAW</text>
  <text x="165" y="373" font-family="Inter, sans-serif" font-size="14" fill="#5b5b5c" text-anchor="middle">DOL Parquet</text>

  <path d="M270 350 L320 350" stroke="#5b5b5c" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="330" y="280" width="190" height="140" rx="6" fill="none" stroke="#B4502A" stroke-width="3"/>
  <text x="425" y="345" font-family="Inter, sans-serif" font-size="22" fill="#B4502A" text-anchor="middle">STAGING</text>
  <text x="425" y="373" font-family="Inter, sans-serif" font-size="14" fill="#E8A33D" text-anchor="middle">rename / cast</text>

  <path d="M530 350 L580 350" stroke="#B4502A" stroke-width="3" marker-end="url(#arrow2)"/>

  <rect x="590" y="280" width="190" height="140" rx="6" fill="none" stroke="#E8A33D" stroke-width="3"/>
  <text x="685" y="335" font-family="Inter, sans-serif" font-size="20" fill="#E8A33D" text-anchor="middle">INTERMEDIATE</text>
  <text x="685" y="363" font-family="Inter, sans-serif" font-size="14" fill="#E8A33D" text-anchor="middle">union / dedupe</text>

  <path d="M790 350 L840 350" stroke="#E8A33D" stroke-width="3" marker-end="url(#arrow3)"/>

  <rect x="850" y="280" width="130" height="140" rx="6" fill="#e0cd8f"/>
  <text x="915" y="345" font-family="Inter, sans-serif" font-size="22" fill="#101112" text-anchor="middle">MARTS</text>
  <text x="915" y="373" font-family="Inter, sans-serif" font-size="14" fill="#101112" text-anchor="middle" opacity="0.7">wage-normalized</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5b5b5c"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#B4502A"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E8A33D"/>
    </marker>
  </defs>

  <text x="70" y="500" font-family="Inter, sans-serif" font-size="20" fill="#8a8a8b">4 quarters FY2025 · Snowflake · dbt</text>
</svg>
